name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pr-integration:
    name: Installed-wheel PR integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools and build wheel
        run: |
          python -m pip install build pytest pyyaml
          python -m build
          python -m pip install dist/*.whl
      - name: Execute maintained workflow and Action shell blocks outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests/test_review_workflow.py" "$GITHUB_WORKSPACE/tests/test_action_shell.py" -v
  windows-review:
    name: Native Windows configuration review
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development checks
        run: python -m pip install -e ".[dev]" twine
      - name: Native review security regressions
        run: python -m pytest tests/test_review.py tests/test_review_stabilization.py tests/test_diff.py
      - name: Offline corpora
        run: |
          python scripts/precision_corpus.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/review_corpus.py --output-dir "$env:RUNNER_TEMP/windows-review-evaluation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/demo_config_review.py --output-dir "$env:RUNNER_TEMP/windows-review-demo"
      - name: Build and validate installed wheel
        run: |
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m twine check --strict (Get-ChildItem dist/*).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-review-evidence
          path: |
            ${{ runner.temp }}/windows-review-evaluation/
            ${{ runner.temp }}/windows-review-demo/
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build package
        run: python -m build

      - name: Offline configuration review corpus and schemas
        run: python scripts/review_corpus.py --output-dir "${{ runner.temp }}/review-evaluation"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-evaluation-${{ matrix.python-version }}
          path: ${{ runner.temp }}/review-evaluation/
