name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build package
        run: python -m build

      - name: Offline configuration review corpus and schemas
        run: python scripts/review_corpus.py --output-dir "${{ runner.temp }}/review-evaluation"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-evaluation-${{ matrix.python-version }}
          path: ${{ runner.temp }}/review-evaluation/
