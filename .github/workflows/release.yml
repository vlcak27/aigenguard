name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "$EXPECTED_SHA^{commit}")"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation tools
        run: python -m pip install -e ".[dev]" twine

      - name: Ruff
        run: python -m ruff check .

      - name: Complete test suite
        run: python -m pytest

      - name: Precision corpus
        run: python scripts/precision_corpus.py

      - name: Required offline review corpus and schema validation
        run: python scripts/review_corpus.py --output-dir "${{ runner.temp }}/release-review-evaluation"

      - name: Build wheel and sdist once
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify contents, version, and isolated wheel installation
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/verify_release.py --dist dist --tag "$RELEASE_TAG"

      - name: Save verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: verified-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified distributions from this run
        uses: actions/download-artifact@v4
        with:
          name: verified-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
