# Example only: requires the FUTURE published AigenGuard 0.9.0 wheel.
# Do not enable until that version is released and approved by your maintainers.
name: Configuration review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trusted scanner before checkout
        run: |
          python -m pip install --only-binary=:all: 'aigenguard==0.9.0'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: review-base
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-head
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare Git objects explicitly
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          # Transfer the base object locally; the scanner itself never fetches.
          git -C "$GITHUB_WORKSPACE/review-head" -c core.hooksPath=/dev/null \
            -c maintenance.auto=false -c protocol.file.allow=always \
            fetch --no-tags --update-shallow "$GITHUB_WORKSPACE/review-base" "$BASE_SHA"
      - name: Review Git data with explicit SHAs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH PYTHONSAFEPATH=1 aigenguard review \
            --path "$GITHUB_WORKSPACE/review-head" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --fail-on high \
            --output-dir "$RUNNER_TEMP/config-review"
      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/config-review/aigenguard-review.md" ]; then
            cat "$RUNNER_TEMP/config-review/aigenguard-review.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configuration-review
          path: ${{ runner.temp }}/config-review/
          if-no-files-found: warn
